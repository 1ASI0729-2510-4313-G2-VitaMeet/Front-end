<div class="page-wrapper">
  <div class="logo-placeholder">
    <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10V40M50 60V90M10 50H40M60 50H90M50 50L40 45L30 50L40 55L50 50Z" stroke="#26A69A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 50L50 45L60 50L50 55L40 50Z" fill="#26A69A"/>
      <path d="M35 50H45L50 47L55 50H65" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="login-container">
    <h2>Register a New Account</h2>

    <!-- Paso 1: Selección de rol -->
    <div *ngIf="!role">
      <label for="role">¿Qué rol deseas registrar?</label>
      <select id="role" name="role" [(ngModel)]="role" required>
        <option value="" disabled selected>Selecciona un rol</option>
        <option value="Paciente">Paciente</option>
        <option value="Médico">Médico</option>
      </select>
    </div>

    <!-- Paso 2: Formulario según rol -->
    <form *ngIf="role" (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div>
        <label for="username">Full Name</label>
        <input type="text" id="fullname" name="fullname" [(ngModel)]="fullname" required />
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required />
      </div>
      <div>
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required />
      </div>
      <!-- Campos adicionales solo para médicos -->
      <div *ngIf="role === 'Médico'">
        <label for="specialty">Especialidad</label>
        <input type="text" id="specialty" name="specialty" [(ngModel)]="specialty" required />
        <label for="license">N° Colegiatura</label>
        <input type="text" id="license" name="license" [(ngModel)]="license" required />
        <label for="experience">Años de experiencia</label>
        <input type="number" id="experience" name="experience" [(ngModel)]="experience" min="0" required />
      </div>
      <button type="submit" class="btn-primary" [disabled]="!registerForm.valid">Registrar</button>
      <button type="button" class="btn-secondary" (click)="role=''">Volver</button>
    </form>

    <div class="extra-links">
      <a routerLink="/login">¿Ya tienes una cuenta? Inicia sesión</a>
    </div>

    <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
  </div>
</div>
