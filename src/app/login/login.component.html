


<div class="page-wrapper">
  <div class="logo-placeholder">
    <!-- Simulate the logo shape. You'd use an <img> or SVG here -->
    <svg width="60" height="60" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10V40M50 60V90M10 50H40M60 50H90M50 50L40 45L30 50L40 55L50 50Z" stroke="#26A69A" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M40 50L50 45L60 50L50 55L40 50Z" fill="#26A69A"/>
      <path d="M35 50H45L50 47L55 50H65" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="login-container">
    <h2>Login to your Account</h2>
    <form (ngSubmit)="login()">
      <div>
        <label for="username">Dirección de correo</label>
        <input id="username" [(ngModel)]="email" name="email" type="text" required />
      </div>
      <div>
        <label for="password">Contraseña</label>
        <input id="password" [(ngModel)]="password" name="password" type="password" required />
      </div>
      <button type="submit">Iniciar Sesión</button>
      <div class="extra-links">
        <a routerLink="/register">¿Aún no tienes una cuenta? Regístrate</a>
        <a href="#">Back to Home</a>
      </div>
    </form>
    </div>

  </div>
