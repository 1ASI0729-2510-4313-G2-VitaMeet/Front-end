<nav class="navbar">
  <div class="navbar-title">VitaMeet</div>
  <div class="navbar-actions">
    <button class="icon-btn" title="Editar perfil" (click)="editarPerfil()">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" stroke="#1d4ed8" stroke-width="2"/>
        <path d="M4 20c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="#1d4ed8" stroke-width="2"/>
      </svg>
    </button>
    <button class="logout-btn" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>

<div class="appointments-list">
  <h2>Citas agendadas</h2>
  <button (click)="nuevaCita()">Crear nueva cita</button>
  <ul>
    <li *ngFor="let cita of appointments">
      <strong>{{ cita.date }} {{ cita.time }}</strong> - {{ cita.doctor.name }} ({{ cita.doctor.specialty }}) en {{ cita.place }}
    </li>
  </ul>
</div>
