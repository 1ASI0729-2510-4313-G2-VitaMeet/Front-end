<nav class="navbar">
  <div class="navbar-title" (click)="backToDashboard()">VitaMeet</div>
  <div class="navbar-actions">
    <button class="icon-btn" title="Editar perfil" (click)="editarPerfil()">
      <svg width="22" height="22" fill="none" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" stroke="#1d4ed8" stroke-width="2"/>
        <path d="M4 20c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="#1d4ed8" stroke-width="2"/>
      </svg>
    </button>
    <button class="logout-btn" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</nav>

<div class="appointments-list">
  <h2>Citas agendadas</h2>
  <div style="display: flex; gap: 1rem; margin-bottom: 1rem; align-items: center;">
    <button (click)="nuevaCita()">Crear nueva cita</button>
    <button (click)="refreshAppointments()" class="refresh-btn" title="Refrescar citas">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
      </svg>
    </button>
  </div>
  <ul>
    <li *ngFor="let cita of appointments" class="appointment-item">
      <div class="appointment-info">
        <strong>{{ cita.date }} {{ cita.time }}</strong> - {{ cita.doctor.fullname }} ({{ cita.doctor.specialty }}) en {{ cita.place }}
        <span class="status" [class.completed]="cita.completed" [class.pending]="!cita.completed">
          {{ cita.completed ? 'Terminada' : 'Pendiente' }}
        </span>
      </div>
      
      <!-- Acciones para citas pendientes -->
      <div class="appointment-actions" *ngIf="!cita.completed">
        <button 
          class="complete-btn" 
          (click)="markAsCompleted(cita.id!)"
          *ngIf="canMarkAsCompleted(cita)"
          title="Marcar como completada">
          Marcar como completada
        </button>
        <button 
          class="cancel-btn" 
          (click)="cancelAppointment(cita.id!)"
          title="Cancelar cita">
          Cancelar
        </button>
        <span *ngIf="!canMarkAsCompleted(cita)" class="upcoming-note">
          Cita programada
        </span>
      </div>
      
      <!-- Acciones para citas completadas -->
      <div class="appointment-actions" *ngIf="cita.completed">
        <button 
          class="evaluate-btn" 
          (click)="evaluateAppointment(cita.id!)"
          *ngIf="!hasEvaluation(cita.id!)">
          Evaluar
        </button>
        <button 
          class="view-evaluation-btn" 
          (click)="viewEvaluation(cita.id!)"
          *ngIf="hasEvaluation(cita.id!)">
          Ver Evaluación
        </button>
      </div>
    </li>
  </ul>
</div>
